name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test runners
        run: |
          python3 -m pip install --quiet pytest==8.3.5
          npm install --no-save --silent playwright@1.61.0 && npx playwright install --with-deps chromium
      - name: Self-test
        run: bash selftest.sh

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Commit trailers
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 benchmark/gates/trailer-check.py --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = push ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            python3 benchmark/gates/trailer-check.py --base "${{ github.event.before }}"
          fi
      - name: Unpinned dependencies in this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | python3 benchmark/gates/pin-check.py
