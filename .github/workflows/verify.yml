name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test runners
        run: |
          python3 -m pip install --quiet pytest==8.3.5
          npm install --no-save --silent playwright@1.61.0
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: Diagnose macOS (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          TIMEFORMAT='%R s'
          cat > "$RUNNER_TEMP/dns.py" <<'PY'
          import socket, time
          def t(label, f):
              s = time.time()
              try:
                  r = f()
              except Exception as e:
                  r = repr(e)
              print("%-28s %6.2fs  %r" % (label, time.time() - s, r), flush=True)
          for i in range(3):
              t("getaddrinfo(localhost)", lambda: socket.getaddrinfo("localhost", 80))
              t("gethostbyaddr(127.0.0.1)", lambda: socket.gethostbyaddr("127.0.0.1"))
              t("getfqdn(127.0.0.1)", lambda: socket.getfqdn("127.0.0.1"))
              t("gethostname()", socket.gethostname)
              t("getfqdn()", lambda: socket.getfqdn())
          PY
          cat > "$RUNNER_TEMP/listen.py" <<'PY'
          import socket, sys, time
          port, began = int(sys.argv[1]), float(sys.argv[2])
          while time.time() - began < 100:
              c = socket.socket(); c.settimeout(1)
              if c.connect_ex(("127.0.0.1", port)) == 0:
                  print("http.server listening after %.2fs" % (time.time() - began)); break
              c.close(); time.sleep(0.1)
          else:
              print("never listened in 100s")
          PY
          cat > "$RUNNER_TEMP/serve.py" <<'PY'
          import faulthandler, runpy, sys
          faulthandler.dump_traceback_later(3, repeat=True, file=sys.stderr)
          sys.argv = ["http.server", sys.argv[1], "--bind", "127.0.0.1"]
          runpy.run_module("http.server", run_name="__main__")
          PY
          echo "::group::dns"
          python3 "$RUNNER_TEMP/dns.py"
          echo "::endgroup::"
          echo "::group::http.server startup"
          for i in 1 2 3; do
            port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1])')
            began=$(python3 -c 'import time; print(time.time())')
            python3 "$RUNNER_TEMP/serve.py" $port > "$RUNNER_TEMP/serve.$i.log" 2>&1 & sp=$!
            python3 "$RUNNER_TEMP/listen.py" $port $began
            curl -sS -o /dev/null -w "curl localhost: dns=%{time_namelookup} connect=%{time_connect} total=%{time_total} code=%{http_code}\n" http://localhost:$port/
            curl -sS -o /dev/null -w "curl 127.0.0.1: dns=%{time_namelookup} connect=%{time_connect} total=%{time_total} code=%{http_code}\n" http://127.0.0.1:$port/
            kill $sp; wait $sp 2>/dev/null
            echo "--- faulthandler output of start $i"; head -30 "$RUNNER_TEMP/serve.$i.log"
          done
          echo "::endgroup::"
          echo "::group::drive.mjs launch cost"
          mkdir -p "$RUNNER_TEMP/site"; echo '<h1>x</h1>' > "$RUNNER_TEMP/site/index.html"; echo '[{"visible":"body"}]' > "$RUNNER_TEMP/any.json"
          port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1])')
          python3 -m http.server $port --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > /dev/null 2>&1 & sp=$!
          python3 "$RUNNER_TEMP/listen.py" $port $(python3 -c 'import time; print(time.time())')
          for i in 1 2 3; do echo -n "drive.mjs run $i: "; time node benchmark/gates/drive.mjs "http://127.0.0.1:$port/" "$RUNNER_TEMP/any.json" | tail -1; done
          kill $sp; wait $sp 2>/dev/null
          echo "::endgroup::"
          echo "::group::acceptance self-test"
          time python3 benchmark/gates/acceptance.py --self-test | grep -E "FAIL|SELF-TEST"
          echo "::endgroup::"
      - name: Self-test
        if: runner.os != 'macOS'
        run: bash selftest.sh

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Commit trailers
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 benchmark/gates/trailer-check.py --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = push ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            python3 benchmark/gates/trailer-check.py --base "${{ github.event.before }}"
          fi
      - name: Unpinned dependencies in this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | python3 .github/ci/pin-check.py
