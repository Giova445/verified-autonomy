name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test runners
        run: |
          python3 -m pip install --quiet pytest==8.3.5
          npm install --no-save --silent playwright@1.61.0
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: Diagnose macOS (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          echo "::group::platform"
          sw_vers; uname -a; sysctl kern.ipc.somaxconn kern.ipc.maxsockbuf; which python3; python3 --version; node --version
          cat /etc/hosts; scutil --dns | head -20; ifconfig lo0
          echo "::endgroup::"
          echo "::group::process launch cost"
          TIMEFORMAT='%R s'
          for i in 1 2 3; do echo -n "python3 -c pass: "; time python3 -c pass; done
          for i in 1 2 3; do echo -n "node -e 0: "; time node -e 0; done
          for i in 1 2 3; do echo -n "sh -c true: "; time sh -c true; done
          for i in 1 2 3; do echo -n "ps lstart: "; time ps -o lstart= -p $$; done
          echo -n "python3 -m http.server import: "; time python3 -c "import http.server"
          echo "::endgroup::"
          echo "::group::sockets"
          python3 - <<'PY'
          import socket, time
          print(socket.getaddrinfo("localhost", 80, type=socket.SOCK_STREAM))
          for backlog in (1, 128):
              srv = socket.socket(); srv.bind(("127.0.0.1", 0)); srv.listen(backlog)
              port = srv.getsockname()[1]
              for i in range(4):
                  t = time.time()
                  try:
                      socket.create_connection(("localhost", port), timeout=1).close(); r = "ok"
                  except OSError as e:
                      r = repr(e)
                  print("backlog", backlog, "connect", i, r, "%.2fs" % (time.time() - t))
              srv.close()
          for fam, host in ((socket.AF_INET6, "::1"), (socket.AF_INET, "127.0.0.1")):
              t = time.time()
              try:
                  s = socket.socket(fam); s.settimeout(1); r = s.connect_ex((host, 9)); s.close()
              except OSError as e:
                  r = repr(e)
              print("connect to closed port", host, r, "%.2fs" % (time.time() - t))
          PY
          echo "::endgroup::"
          echo "::group::lstart across exec"
          sh -c 'ps -o lstart= -p $$; sleep 2; exec sleep 3' & sp=$!
          sleep 1; ps -o lstart= -p $sp; sleep 3; ps -o lstart= -p $sp; wait
          echo "::endgroup::"
          echo "::group::acceptance self-test"
          time python3 benchmark/gates/acceptance.py --self-test
          echo "::endgroup::"
          echo "::group::installed self-test"
          w="$(mktemp -d)"; ( cd "$w" && git init -q . && git config user.email t@t && git config user.name t && printf '.claude/*\n' > .gitignore && git add -A && git commit -qm init )
          ( cd "$w" && ARM_TIMEOUT=30 bash "$GITHUB_WORKSPACE/kit/install.sh" . ) >/dev/null 2>&1
          ( cd "$w" && bash .claude/selftest.sh ); echo "installed selftest rc=$?"
          echo "::endgroup::"
          echo "::group::product-live"
          bash tests/product-live.sh 2>&1 | while IFS= read -r l; do printf '[%4ss] %s\n' "$SECONDS" "$l"; done
          echo "::endgroup::"
      - name: Self-test
        if: runner.os != 'macOS'
        run: bash selftest.sh

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Commit trailers
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 benchmark/gates/trailer-check.py --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = push ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            python3 benchmark/gates/trailer-check.py --base "${{ github.event.before }}"
          fi
      - name: Unpinned dependencies in this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | python3 .github/ci/pin-check.py
