name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test runners
        run: |
          python3 -m pip install --quiet pytest==8.3.5
          npm install --no-save --silent playwright@1.61.0
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: Diagnose macOS (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          bounded() { perl -e 'alarm 12; exec @ARGV' "$@"; echo "   rc=$? (142 = still stalled after 12 s)"; }
          fq() { bounded python3 -c "import socket,time; t=time.time(); r=socket.getfqdn('127.0.0.1'); print('   getfqdn(127.0.0.1) %.2fs %r' % (time.time()-t, r))"; }
          iface=$(route -n get default | awk '/interface:/{print $2}'); svc=$(networksetup -listallhardwareports | awk -v d="$iface" '/Hardware Port/{p=substr($0,16)} /Device: /{if($2==d)print p}')
          echo "iface=$iface service=$svc"; networksetup -getdnsservers "$svc"; scutil --dns | grep -E "nameserver|domain|resolver"
          echo "::group::packets during a stalled reverse lookup"
          sudo tcpdump -i "$iface" -n -l -tttt -c 60 'port 53 or port 5353' > "$RUNNER_TEMP/dump.txt" 2>&1 & tp=$!
          sleep 1; fq; sleep 1; sudo kill $tp 2>/dev/null; sleep 1; head -40 "$RUNNER_TEMP/dump.txt"
          echo "::endgroup::"
          echo "::group::remedy: dns 127.0.0.1"
          sudo networksetup -setdnsservers "$svc" 127.0.0.1; fq
          echo "::endgroup::"
          echo "::group::remedy: dns 1.1.1.1"
          sudo networksetup -setdnsservers "$svc" 1.1.1.1 8.8.8.8; fq
          echo "::endgroup::"
          sudo networksetup -setdnsservers "$svc" empty
          echo "::group::product-live"
          bash tests/product-live.sh 2>&1 | while IFS= read -r l; do printf '[%4ss] %s\n' "$SECONDS" "$l"; done
          echo "::endgroup::"
      - name: Self-test
        if: runner.os != 'macOS'
        run: bash selftest.sh

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Commit trailers
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 benchmark/gates/trailer-check.py --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = push ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            python3 benchmark/gates/trailer-check.py --base "${{ github.event.before }}"
          fi
      - name: Unpinned dependencies in this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | python3 .github/ci/pin-check.py
