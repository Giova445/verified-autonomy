name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test runners
        run: |
          python3 -m pip install --quiet pytest==8.3.5
          npm install --no-save --silent playwright@1.61.0
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: Diagnose macOS (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import socket, sys, time
          slow = 0
          for label, f in (("getfqdn(127.0.0.1)", lambda: socket.getfqdn("127.0.0.1")), ("getfqdn()", lambda: socket.getfqdn())):
              t = time.time(); r = f(); d = time.time() - t
              print("   %-20s %6.2fs %r" % (label, d, r), flush=True)
              slow += d > 2
          sys.exit(1 if slow else 0)
          PY
          probe() { echo "probe after: $1"; python3 "$RUNNER_TEMP/probe.py"; }
          echo "hostname=$(hostname) short=$(hostname -s)"; cat /etc/hosts | grep -v '^#'
          probe "nothing"
          echo "::group::hosts entry"
          echo "127.0.0.1 $(hostname) $(hostname -s)" | sudo tee -a /etc/hosts
          probe "hosts entry" && fixed=hosts
          echo "::endgroup::"
          if [ -z "$fixed" ]; then
            echo "::group::flush resolver"
            sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder; sleep 2
            probe "flush + HUP mDNSResponder" && fixed=flush
            echo "::endgroup::"
          fi
          if [ -z "$fixed" ]; then
            echo "::group::scutil hostname"
            sudo scutil --set HostName localhost; sudo scutil --set LocalHostName localhost; sudo scutil --set ComputerName localhost
            probe "hostname localhost" && fixed=scutil
            echo "::endgroup::"
          fi
          echo "remedy that worked: ${fixed:-none}"
          echo "::group::product-live"
          bash tests/product-live.sh 2>&1 | while IFS= read -r l; do printf '[%4ss] %s\n' "$SECONDS" "$l"; done
          echo "::endgroup::"
          echo "::group::acceptance self-test"
          python3 benchmark/gates/acceptance.py --self-test | grep -E "FAIL|SELF-TEST"
          echo "::endgroup::"
      - name: Self-test
        if: runner.os != 'macOS'
        run: bash selftest.sh

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Commit trailers
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            python3 benchmark/gates/trailer-check.py --base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = push ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            python3 benchmark/gates/trailer-check.py --base "${{ github.event.before }}"
          fi
      - name: Unpinned dependencies in this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | python3 .github/ci/pin-check.py
