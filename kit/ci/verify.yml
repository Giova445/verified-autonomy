name: Verify
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Add your language setup and dependency install steps here; gates run in this job.

      - name: Install the browser driver (only if the project declares a product contract)
        if: hashFiles('.claude/acceptance.json') != ''
        run: npm install --no-save playwright@1.61.0 && npx playwright install --with-deps chromium

      - name: Forbidden commit trailers (no-op unless .claude/forbidden-trailers exists)
        if: github.event_name == 'pull_request'
        run: python3 .claude/gates/trailer-check.py --base "origin/${{ github.base_ref }}"

      - name: Verify
        run: ./bin/verify done
        env:
          VERIFY_BASE: origin/${{ github.base_ref || 'main' }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: evidence
          path: .claude/evidence/
